<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ServiceCRM</title>
<style>
:root{--blue:#2563eb;--green:#10b981;--red:#dc2626;--dark:#1e293b}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:#f5f5f5;max-width:430px;margin:0 auto;padding-bottom:110px;min-height:100vh}
.header{background:var(--blue);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.header.dark{background:var(--dark)}.header.green{background:var(--green)}.header.red{background:var(--red)}
.header h1{font-size:17px}
.back{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
.card{background:#fff;margin:12px 16px;padding:14px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sec-title{font-weight:600;font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.muted{font-size:12px;color:#666}
.badge{display:inline-block;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:600;margin:2px 4px 2px 0}
.role-card{border:1px solid #e5e5e5;border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.role-card:active{background:#f0f7ff}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #e5e5e5;z-index:10}
/* === ТРЕЙ СХЕМЫ: единственный контейнер, ручка сворачивания (A1–A6) === */
#scheme-tray{position:fixed;top:60px;right:0;bottom:0;width:320px;max-width:90vw;background:#fff;box-shadow:-4px 0 12px rgba(0,0,0,.15);z-index:95;padding:16px;display:none}
#scheme-tray.open{display:block}
#tray-body{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
#tray-collapse{position:absolute;left:-20px;top:14px;width:44px;height:44px;min-width:44px;min-height:44px;border-radius:50%;background:#2563eb;color:#fff;border:none;box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:22px;line-height:44px;text-align:center;cursor:pointer;padding:0}
#tray-handle{position:fixed;right:0;top:45%;width:44px;height:100px;background:#2563eb;color:#fff;border:none;border-radius:12px 0 0 12px;box-shadow:-2px 2px 10px rgba(0,0,0,.3);z-index:96;font-size:24px;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0}
@media (max-width:430px){#scheme-tray{width:85vw}}
.nav-item{min-width:0;position:relative;text-align:center;padding:8px 2px;cursor:pointer;color:#666;font-size:10px}
.nav-item span{display:block;font-size:20px}
.nav-item [data-ev-badge]{position:absolute;top:-4px;right:calc(50% - 22px);width:18px;height:18px;background:#dc2626;color:#fff;border-radius:50%;font:700 11px/18px sans-serif;text-align:center;pointer-events:none}
.nav-item.active{color:var(--blue)}
@media (max-width:380px){#nav .nav-item{padding:6px 1px;font-size:9px}#nav .nav-item span{font-size:18px}}
@media (max-width:330px){#nav .nav-item{padding:6px 0;font-size:8px}#nav .nav-item span{font-size:16px}}
.input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;background:#fff}
textarea.input{min-height:60px;resize:vertical}
.label{display:block;font-weight:500;font-size:13px;margin-bottom:5px;color:#333}
.field{margin-bottom:12px}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}
.btn-blue{background:var(--blue);color:#fff}.btn-green{background:var(--green);color:#fff}
.btn-red{background:#fee2e2;color:#991b1b}.btn-purple{background:#8b5cf6;color:#fff}
.btn-outline{background:#fff;border:1px solid var(--blue);color:var(--blue)}
.btn-sm{padding:8px 10px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{padding:6px 11px;border:1px solid var(--blue);color:var(--blue);border-radius:14px;font-size:12px;cursor:pointer;background:#fff;user-select:none}
.chip.sel{background:var(--blue);color:#fff}
.mat{border:1px solid #eee;border-radius:8px;padding:10px;margin-bottom:8px}
.mat-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.mat-name{font-weight:600;font-size:13px}
.ord{background:#fff;margin:10px 16px;padding:14px;border-radius:12px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ord:active{transform:scale(.99)}
.filters{display:flex;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid #eee;overflow-x:auto}
.fbtn{padding:6px 12px;border:1px solid #ddd;border-radius:16px;background:#fff;font-size:12px;cursor:pointer;white-space:nowrap}
.fbtn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.info-row{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;border-bottom:1px solid #f5f5f5}
.info-row:last-child{border:none}
.total{display:flex;justify-content:space-between;padding:8px 0;font-weight:700;font-size:16px;border-top:2px solid #eee;margin-top:6px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photo{width:64px;height:64px;border-radius:8px;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:22px}
.photo-add{border:2px dashed var(--blue);background:#fff;color:var(--blue);cursor:pointer}
.slot{border:1px solid #eee;border-radius:8px;padding:10px;margin-bottom:8px;border-left:4px solid #ccc}
.switch{position:relative;width:44px;height:25px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#ccc;border-radius:25px;transition:.2s;cursor:pointer}
.slider:before{content:'';position:absolute;height:19px;width:19px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
input:checked+.slider{background:var(--green)}
input:checked+.slider:before{transform:translateX(19px)}
.tgl{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #f0f0f0}
h1,h2,h3{font-weight:600}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="icon.png">
</head>
<body>

<div id="app"></div>
<div id="modal-root"></div>
<div id="scheme-tray"><button id="tray-collapse" type="button" onclick="closeSchemeTray()">›</button><div id="tray-body"></div></div>
<button id="tray-handle" type="button" onclick="reopenSchemeTray()">‹</button>
<nav id="nav" style="display:none"></nav>
<script>
// === BOOT-GUARD: самовосстановление при битом кэше SW ===
// Фатальная ошибка на этапе загрузки (до старта SDK) + флаг crm_recovered отсутствует
// → чистим ВСЕ кэши и перезагружаемся один раз. Вторая попытка не делается.
(function(){
 var RECOVER_FLAG='crm_recovered';
 function showFatal(){
  try{
   document.getElementById('app').innerHTML='<div class="card" style="text-align:center;padding:28px 16px;margin-top:40px">'+
    '<div style="font-size:40px">📡</div><div style="font-weight:700;margin:10px 0">Ошибка загрузки</div>'+
    '<div class="muted">Проверьте интернет и перезагрузите страницу.<br>Если не помогает — обновите приложение или обратитесь к владельцу.</div>'+
    '<button class="btn btn-blue" style="margin-top:12px" onclick="location.reload()">🔄 Перезагрузить</button></div>';
  }catch(e){}
 }
 window.onerror=function(msg,src,line,col,err){
  if(sessionStorage.getItem(RECOVER_FLAG)==='1'){ showFatal(); return false; }
  // ошибки сети (Failed to fetch, NetworkError, ERR_INTERNET) — штатный офлайн, НЕ фатальны
  var m=String(msg||'');
  if(/Failed to fetch|NetworkError|network|ERR_INTERNET|ERR_NETWORK|ERR_CONNECTION|The internet connection|Load failed/i.test(m))return false;
  // считаем фатальной ошибку в основном скрипте приложения (не в сторонних SDK)
  var fatal=!src||src.indexOf('firebase')<0;
  if(!fatal)return false;
  sessionStorage.setItem(RECOVER_FLAG,'1');
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){
   navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(r){ try{r.unregister();}catch(e){} });
   }).catch(function(){});
  }
  if(window.caches&&caches.keys){
   caches.keys().then(function(ks){
    return Promise.all(ks.map(function(k){return caches.delete(k);}));
   }).then(function(){ location.reload(); }).catch(function(){ location.reload(); });
  } else location.reload();
  return true;
 };
})();
</script>
<script>
const fmt=d=>d.toISOString().slice(0,10);
const d0=fmt(new Date()),d1=fmt(new Date(Date.now()+864e5)),d2=fmt(new Date(Date.now()+2*864e5)),d7=fmt(new Date(Date.now()+7*864e5));
const ST={
 new:{t:'Новая',c:'#fef3c7',tc:'#92400e'},
 inspection:{t:'Осмотр/диагностика',c:'#dbeafe',tc:'#1e40af'},
 approved:{t:'Смета согласована',c:'#ede9fe',tc:'#5b21b6'},
 in_progress:{t:'В работе',c:'#ffedd5',tc:'#9a3412'},
 inwork:{t:'В работе',c:'#ffedd5',tc:'#9a3412'},
 paused:{t:'На паузе',c:'#fef3c7',tc:'#92400e'},
 waiting:{t:'Ожидание материала',c:'#fee2e2',tc:'#991b1b'},
 postponed:{t:'Перенос',c:'#e5e7eb',tc:'#374151'},
 canceled:{t:'Отменена',c:'#e5e7eb',tc:'#6b7280'},
 completed:{t:'Выполнено',c:'#d1fae5',tc:'#065f46'},
 paid:{t:'Оплачено',c:'#a7f3d0',tc:'#064e3b'}
};
const BUYER={worker:'Работник перед выездом',manager:'Диагност/менеджер',delivery:'Доставка на адрес',stock:'Есть на складе'};
// === тестовые заявки и отмена ===
function showTest(){return !!(DB&&DB.showTest)}
function isTest(o){return !!o.test}
// тестовые скрыты при showTest=false (списки/календарь/задачи/схема/уведомления);
// из отчётов/финансов/CSV/долей исключены ВСЕГДА
function visOrder(o){return !isTest(o)||(showTest()&&adminLike())}
// тестовые видимы только владельцу/админу и только при включённом тумблере
function adminLike(){if(typeof isOwner==='function'&&isOwner())return true;return state.role==='admin'||state.user==='Владелец';}
function bizOrder(o){return !isTest(o)}
function canCancel(){if(typeof can==='function')return isOwner()||can('orders_cancel');return (typeof isOwner==='function'&&isOwner())||['admin'].includes(state.role)}
// «Взять в работу»: право orders_take (по умолчанию owner/admin/manager/operator),
// создатель заявки имеет его неявно всегда
function canTakeOrder(o){if(typeof can==='function')return isOwner()||can('orders_take')||(o&&o.by&&o.by===state.user);return (typeof isOwner==='function'&&isOwner())||['admin','manager','operator'].includes(state.role)}
// «В работе»: canonical-статус inwork + legacy in_progress (старые заявки без takenBy)
function isInwork(o){return !!o&&(o.status==='inwork'||o.status==='in_progress')}
// чужие взятые заявки: владелец/админ или право orders_view_all
function canViewAllOrders(){if(typeof adminLike==='function'&&adminLike())return true;if(typeof can==='function')return can('orders_view_all');return false}
// взятая другим работником заявка скрыта тем, у кого нет orders_view_all
function hiddenTakeFromMe(o){return isInwork(o)&&!!o.worker&&o.worker!==state.user&&!canViewAllOrders()}
// F2: сегодня, без исполнителя, до начала <=1 часа — срочная (жёлтая подсветка, вверх списка)
function urgentSoon(o){
 if(!o||o.worker||o.date!==d0)return false;
 if(['completed','paid','canceled'].indexOf(o.status)>=0)return false;
 if(!o.t1)return false;
 const p=o.t1.split(':').map(Number);
 const diff=(p[0]*60+(p[1]||0))-(new Date().getHours()*60+new Date().getMinutes());
 return diff>=0&&diff<=60;
}
// кнопка «Взять в работу»: статус new/approved + право + (исполнитель пуст ИЛИ я создатель/owner/admin)
function showTakeBtn(o){
 if(!o||['new','approved'].indexOf(o.status)<0)return false;
 if(!canTakeOrder(o))return false;
 if(!o.worker)return true;
 if(typeof isOwner==='function'&&isOwner())return true;
 if(o.by&&o.by===state.user)return true;
 return typeof adminLike==='function'&&adminLike();
}
// удаление заявки: владелец или право orders_delete
function canDeleteOrder(){if(typeof can==='function')return isOwner()||can('orders_delete');return (typeof isOwner==='function'&&isOwner())||['admin'].includes(state.role)}
function deleteOrder(id){
 const o=byId(id);if(!o)return;
 if(!canDeleteOrder())return alert('Нет права orders_delete');
 if(!confirm('Удалить заявку №'+id+' («'+(o.client||'')+'»)? Действие необратимо.'))return;
 DB.orders=DB.orders.filter(x=>x.id!==id);
 if(typeof orderDelete==='function')orderDelete(id);
 if(typeof pushEvent==='function')pushEvent('order','🗑 Удалена заявка №'+id,'Клиент: '+escapeHtml(o.client||'')+' • удалил: '+escapeHtml(state.user||''),null,true);
 render();
}
// === ИСТОРИЯ ЗАЯВКИ ===
function logAction(order,action,details){
 if(!order)return order;
 order.history=order.history||[];
 order.history.push({ts:new Date().toISOString(),by:(typeof deviceId==='function'?deviceId():'system'),action:action,details:details||null});
 if(order.history.length>100)order.history=order.history.slice(-100);
 return order;
}
const HIST_A={view:'Просмотрен',pause:'Пауза',create:'Создана',assign:'Назначен исполнитель',take:'Взят в работу',status_change:'Смена статуса',payment_received:'Платёж получен',payment_materials:'Выдано на материалы',stage_add:'Добавлен этап',stage_complete:'Этап завершён',cancel:'Отменена',photo_add:'Добавлено фото',edit:'Правка заявки',calendar_move:'Перенос в календаре'};
function userNameById(devId){
 if(!devId)return '';
 if(devId==='system')return 'система';
 var u=(DB.users||[]).find(function(x){return x.deviceId===devId;});
 return u?u.name:devId;
}
function histLine(h){
 var d=h.details||{};
 var txt='';
 if(h.action==='create')txt=(d.client||'')+' • '+(d.sum!=null?money(d.sum):'');
  else if(h.action==='assign')txt='исполнитель: '+(d.worker||'—')+(d.from?' (вместо '+d.from+')':'');
  else if(h.action==='take')txt=(d.worker||'')+(d.from?' (вместо '+d.from+')':'');
  else if(h.action==='calendar_move')txt=(d.fields||[]).join(', ');
 else if(h.action==='status_change')txt=(ST[d.from]&&ST[d.from].t||d.from||'')+' → '+(ST[d.to]&&ST[d.to].t||d.to||'');
 else if(h.action==='payment_received')txt=money(d.sum)+' • '+(PAY_T[d.type]||d.type||'')+' • '+(PAY_M[d.method]||d.method||'')+(d.note?' • '+d.note:'');
 else if(h.action==='payment_materials')txt=money(d.sum);
 else if(h.action==='stage_add'||h.action==='stage_complete')txt='«'+(d.stageTitle||'')+'»';
 else if(h.action==='cancel')txt='причина: '+(d.reason||'—');
 else if(h.action==='photo_add')txt=(d.count||1)+' шт.';
 else if(h.action==='edit')txt=(d.fields||[]).join(', ');
 return txt;
}
function historyBlock(o){
 if(!(typeof can==='function'&&can('orders_history'))&&!isOwner())return '';
 var hist=(o.history||[]).slice().sort(function(a,b){return String(b.ts).localeCompare(String(a.ts));});
 var html='<div class="card"><div class="sec-title">📜 История</div>';
 if(!hist.length)return html+'<div class="muted">Событий пока нет</div></div>';
 hist.forEach(function(h,idx){
  var u=(typeof userNameById==='function'&&userNameById(h.by))||h.by;
  var line=histLine(h);
  var open=idx===0; // первое (свежее) событие раскрыто
  html+='<div class="info-row" style="cursor:pointer;align-items:flex-start" onclick="histToggle(this)">'+
   '<span>'+ (open?'▾ ':'▸ ')+(HIST_A[h.action]||h.action)+
    '<div class="hist-details" style="display:'+(open?'block':'none')+';margin-top:4px">'+
     (line?'<div class="muted">'+escapeHtml(line)+'</div>':'')+
     '<div class="muted" style="font-size:11px">'+escapeHtml(u)+' • '+new Date(h.ts).toLocaleString()+'</div>'+
    '</div></span>'+
   '<span class="muted" style="text-align:right;font-size:12px;white-space:nowrap">'+new Date(h.ts).toLocaleDateString()+'<br>'+new Date(h.ts).toLocaleTimeString().slice(0,5)+'</span></div>';
 });
 return html+'</div>';
}
function histToggle(el){
 var d=el.querySelector('.hist-details');
 if(!d)return;
 var head=el.querySelector('span');
 var open=d.style.display!=='none';
 d.style.display=open?'none':'block';
 if(head)head.innerHTML=(open?'▸ ':'▾ ')+head.innerHTML.replace(/^[▸▾]\s*/,'');
}
function defaultData(){return{
 seq:270,
 clients:[],
 users:[
  {id:'u1',name:'Дмитрий',role:'admin',share:0},
  {id:'u2',name:'Оля',role:'operator',share:0},
  {id:'u3',name:'Анна',role:'manager',share:0},
  {id:'u4',name:'Вася',role:'worker',share:50},
  {id:'u5',name:'Петя',role:'worker',share:40}],
 templates:[
  {id:'t1',name:'Осмотр и диагностика',price:1500},
  {id:'t2',name:'Замеры',price:1000},
  {id:'t3',name:'Установка кондиционера',price:12000},
  {id:'t4',name:'Обслуживание вентиляции',price:6500},
  {id:'t5',name:'Штробление стены (м.п.)',price:1500},
  {id:'t6',name:'Демонтаж старого блока',price:2000}],
 orders:[],
 regions:[{region:'Свердловская область',cities:['Екатеринбург','Нижний Тагил','Каменск-Уральский','Первоуральск']}]};}
let DB,state={role:null,user:null,screen:'orders',orderId:null,filter:'all',calDate:d0,newMats:[]};
function load(){try{DB=JSON.parse(localStorage.getItem('crm_db'))||defaultData()}catch(e){DB=defaultData()}
 // B1: миграция старых баз — справочник регионов
 if(!DB.regions||!DB.regions.length)DB.regions=[{region:'Свердловская область',cities:['Екатеринбург','Нижний Тагил','Каменск-Уральский','Первоуральск']}];
}
function save(){localStorage.setItem('crm_db',JSON.stringify(DB));
 // облачная запись: window.save сам смотрит state.__mutOrder (заявка → её документ, иначе настройки)
 if(typeof window.save==='function')window.save();
}
function markOrder(o){
 // фикс для edit-лога: снимок ключевых полей до мутации (сравнение делается в save())
 if(!state.__mutOrder||state.__mutOrder.id!==o.id){
  state.__snapFields={sum:total(o),date:o.date,t1:o.t1,t2:o.t2,address:o.address,worker:o.worker,client:o.client};
 } else if(!state.__snapFields){
  state.__snapFields={sum:total(o),date:o.date,t1:o.t1,t2:o.t2,address:o.address,worker:o.worker,client:o.client};
 }
 state.__mutOrder=o;
}
function reset(){localStorage.removeItem('crm_db');load();render();alert('Демо-данные сброшены')}
load();
const money=n=>(+n||0).toLocaleString('ru')+' ₽';
const total=o=>{var ex=(o.extras||[]).reduce((s,e)=>s+(+e.price||0),0);var m=o.matsInTotal?(o.materials||[]).reduce((s,x)=>s+(+x.price||0),0):0;if((o.works||[]).length)return (o.works||[]).filter(x=>!x.skipped).reduce((s,x)=>s+(+x.price||0)*(+x.qty||1),0)+ex+m;return (+o.price||0)+ex+m;};
// === ТИПЫ ЗАЯВКИ, ЭТАПЫ, ПЛАТЕЖИ ===
const OTYPE={standard:'Стандарт',manufacture:'С изготовлением',service:'Сервисный'};
const STAGE_T={measure:'Замер',make:'Изготовление',install:'Монтаж',repair:'Ремонт',service:'Выезд'};
const PAY_T={advance:'Аванс',partial:'Частичный',full:'Полный',materials:'На материалы'};
const PAY_M={cash:'Наличные',card:'Карта',transfer:'Перевод'};
function orderType(o){return o.type||'standard'}
function orderStages(o){return o.stages||[];}
function orderPayments(o){return o.payments||[]}
function totalPaid(o){return orderPayments(o).filter(p=>p.type!=='materials').reduce((s,p)=>s+(+p.sum||0),0)}
function materialsPaid(o){return orderPayments(o).filter(p=>p.type==='materials').reduce((s,p)=>s+(+p.sum||0),0)}
function balance(o){return total(o)-totalPaid(o)}
function canFinance(){if(typeof can==='function')return isOwner()||can('finance_edit');return (typeof isOwner==='function'&&isOwner())||['admin'].includes(state.role)}
function stageDefault(type){
 if(type==='manufacture')return [
  {id:'st1',type:'measure',title:'Замер',dueMode:'date',plan_start:'',plan_ready:'',done:false,by:'',ts_done:null},
  {id:'st2',type:'make',title:'Изготовление',dueMode:'date',plan_start:'',plan_ready:'',done:false,by:'',ts_done:null},

function matState(o,m){
 if(m.status==='bought')return{k:'bought',t:'✅ Закуплен',c:'#d1fae5',tc:'#065f46',cd:''};
 if(m.status==='delivery')return{k:'delivery',t:'🚚 В доставке',c:'#dbeafe',tc:'#1e40af',cd:''};
 if(m.status==='issue')return{k:'issue',t:'❌ Не найден',c:'#fee2e5',tc:'#991b1b',cd:'нужно решение'};
 if(!o.date)return{k:'todo',t:'📋 К закупке',c:'#f0fdf4',tc:'#065f46',cd:'без срока'};
 const work=new Date(o.date+'T'+(o.t1||'09:00')).getTime();
 const dl=work-(m.unit==='h'?m.deadline:m.deadline*24)*36e5;
 const diff=dl-Date.now();
 if(diff<0)return{k:'critical',t:'🔴 Критично',c:'#fee2e2',tc:'#991b1b',cd:'просрочен на '+dur(-diff)};
 if(diff<3*36e5)return{k:'urgent',t:'⏳ Срок наступает',c:'#fef3c7',tc:'#92400e',cd:'осталось '+dur(diff)};

}

    ${p.status==='arrived'?`<button class="btn-sm btn-green" onclick="routeDonePoint(${o.id},${i})">✅ Выполнено</button>`:''}
    ${p.status==='pending'&&i>0&&r[i-1].status==='done'?`<button class="btn-sm btn-outline" onclick="routeNext(${o.id},${i})">▶ В путь</button>`:''}
   </div>`:'')+
  '</div>';
 });
 if(editable)html+='<button class="btn-sm btn-outline" style="margin-top:8px" onclick="routeAddPoint('+o.id+')">＋ Точка</button>';
 html+='<div style="margin-top:10px"><b>🚗 Весь маршрут:</b> '+
  '<a class="btn-sm btn-outline" style="text-decoration:none" target="_blank" href="https://yandex.ru/maps/?mode=auto&rtext='+r.map(function(p){return encodeURIComponent(p.address||'');}).join('~')+'">Яндекс</a> '+
  '<a class="btn-sm btn-outline" style="text-decoration:none" target="_blank" href="https://www.google.com/maps/dir/'+r.map(function(p){return encodeURIComponent(p.address||'');}).join('/')+'">Google</a></div>';
 // лог движения (времена + гео) — для владельца/оператора
 var log=[];
 r.forEach(function(p){
  if(p.ts_arrived)log.push({t:p.ts_arrived,txt:'📍 Прибыл: '+p.title+(p.geo?' ('+p.geo.lat.toFixed(4)+','+p.geo.lon.toFixed(4)+')':'')});

 if(log.length){ log.sort(function(a,b){return a.t-b.t;});
  html+='<div style="margin-top:10px;border-top:1px solid #eee;padding-top:8px"><b>📜 Лог движения</b>'+
   log.map(function(l){return '<div class="muted">'+new Date(l.t).toLocaleString()+' — '+escapeHtml(l.txt)+'</div>';}).join('')+'</div>';
 }
 return html;
}
function routeScreen(id){
 const o=byId(id);if(!o)return;
 if(!visOrder(o)&&!canCancel())return alert('Тестовая заявка скрыта (включите «Показывать тестовые» в админке)');
 const editable=o.route&&o.route.length?canEditRoute(o):false;
 document.getElementById('app').innerHTML='<div class="header"><button class="back" onclick="go(\''+(state.role==='worker'?'tasks':'details')+'\','+(state.role==='worker'?id:id)+')">←</button><h1>🗺 Схема — №'+o.id+'</h1></div>'+
  '<div class="card">'+routeTimeline(o,editable)+'</div>';
}
function routeMove(id,i,d){const o=byId(id);if(!canEditRoute(o))return;const r=o.route;const j=i+d;if(j<0||j>=r.length)return;const t=r[i];r[i]=r[j];r[j]=t;markOrder(o);save();routeScreen(id)}
function routeDel(id,i){const o=byId(id);if(!canEditRoute(o))return;if(!confirm('Удалить точку?'))return;o.route.splice(i,1);markOrder(o);save();routeScreen(id)}
function routeAddPoint(id){
 const o=byId(id);if(!canEditRoute(o))return;
 const t=prompt('Название точки:');if(!t)return;
 const a=prompt('Адрес точки:','')||'';
 o.route.push({id:'p'+Date.now(),type:'custom',title:t,address:a,status:'pending'});
 markOrder(o);save();routeScreen(id);
}
function routeArrive(id,i){
 const o=byId(id);
 const isExec=(typeof state!=='undefined'&&state.user===o.worker);
 if(!isExec&&!canDoRoute(o))return alert('Нет прав');
 const p=o.route[i];
 p.status='arrived';p.ts_arrived=Date.now();
 markOrder(o);save();routeScreen(id);
 if(p.type==='supplier'&&canFinance()&&materialsPaid(o)>0){
  const spent=prompt('Подтвердите сумму закупки (выдано на материалы: '+money(materialsPaid(o))+'):','')||'';
  const s=+spent||0;
  if(s>0){
   const rest=Math.max(0,materialsPaid(o)-s);
   o.payments.push({id:'p'+Date.now(),sum:materialsPaid(o),type:'materials',method:'cash',date:new Date().toISOString().slice(0,10),note:'закупка '+p.title+': '+money(s)+', остаток '+money(rest)});
   markOrder(o);save();
   alert('Списано '+money(s)+', остаток аванса '+money(rest));
  }
 }
 if(typeof pushEvent==='function')pushEvent('route','📍 Прибытие — заявка №'+o.id,escapeHtml(o.worker||'')+' прибыл: '+escapeHtml(p.title),o.id,true);
}
function routeDonePoint(id,i){
 const o=byId(id);if(!canDoRoute(o))return alert('Нет прав');
 const p=o.route[i];
 p.status='done';p.ts_done=Date.now();
 var nxt=o.route[i+1];
 if(nxt&&nxt.status==='pending')nxt.status='way';
 markOrder(o);save();routeScreen(id);
 if(typeof pushEvent==='function')pushEvent('route','✅ '+escapeHtml(o.worker||'')+': '+escapeHtml(p.title)+' выполнено','Заявка №'+o.id+' — прогресс '+routeProgress(o),o.id);
}
function routeNext(id,i){const o=byId(id);if(!canDoRoute(o))return;o.route[i].status='way';markOrder(o);save();routeScreen(id)}

function renderCalendar(){
 const list=DB.orders.filter(o=>o.date===state.calDate&&visOrder(o)&&o.status!=='canceled'&&!hiddenTakeFromMe(o)).sort((a,b)=>(urgentSoon(b)?1:0)-(urgentSoon(a)?1:0)||(a.t1||'').localeCompare(b.t1||''));
 const slots=['08:00–10:00','10:00–12:00','12:00–14:00','14:00–16:00','16:00–18:00','18:00–20:00'];
 return `
<div class="header"><h1>📅 Календарь</h1><input type="date" value="${state.calDate}" onchange="state.calDate=this.value;render()" style="margin-left:auto;padding:6px;border-radius:6px;border:none"></div>
<div class="card">
 <div class="sec-title">Загрузка на ${state.calDate.slice(8)}.${state.calDate.slice(5,7)} <span class="muted" style="font-weight:400;font-size:12px">(клик — открыть/создать, удержание — перенести)</span></div>
 ${slots.map((slot,si)=>{
   const [sStart,sEnd]=slot.split('–');
   const inSlot=list.filter(o=>o.t1<sEnd&&o.t2>sStart);
   const busy=inSlot.filter(o=>o.worker);
const past=slotIsPast(state.calDate,sStart,sEnd);
   return `<div class="slot" data-slot="${si}" data-start="${sStart}" data-end="${sEnd}"
    style="${past?'opacity:.45;filter:grayscale(1);':CAL_SRC===si?'border:2px dashed #f59e0b;background:#fffbeb':busy.length?'border-left-color:var(--red);background:#fef2f2':inSlot.length?'border-left-color:var(--blue);background:#f8faff':'border-left-color:var(--green);background:#f0fdf4;cursor:pointer'}"
    onmousedown="calSlotClick(event,${si},'${sStart}','${sEnd}')" ontouchstart="calSlotClick(event,${si},'${sStart}','${sEnd}')"
    onmouseup="calSlotRelease(event,${si},'${sStart}','${sEnd}')" ontouchend="calSlotRelease(event,${si},'${sStart}','${sEnd}')"
    ondragover="event.preventDefault()" ondrop="calDrop(event,${si},'${sStart}','${sEnd}')">
    <b style="font-size:13px">${slot}</b>
    ${inSlot.length?inSlot.map(o=>`<div class="cal-order" data-oid="${o.id}" draggable="true" ondragstart="CAL_DRAG=${o.id};event.stopPropagation()" style="font-size:13px;margin-top:4px;cursor:grab${urgentSoon(o)?';background:#fef9c3;border-left:3px solid #f59e0b;padding-left:4px':''}"
     onmousedown="calOrderDown(event,${o.id},${si})" ontouchstart="calOrderDown(event,${o.id},${si})"
     onclick="if(Date.now()-(CAL_HELD||0)<700)return;event.stopPropagation();go('details',${o.id})">
     ${o.worker?'🔴':'🟦'} ${o.t1}–${o.t2} • ${escapeHtml(o.client)} ${o.worker?'• <b>'+escapeHtml(o.worker)+'</b>':''} <span class="badge" style="background:${ST[o.status].c};color:${ST[o.status].tc}">${ST[o.status].t}</span></div>`).join('')
    :'<div class="muted" style="margin-top:2px">🟩 свободно — клик для новой заявки</div>'}
   </div>`}).join('')}
</div>`}
function renderTasks(){
 // вкладки: Доступные / В работе / Завершённые (выбор в localStorage, посадка — «Доступные»)
 const tabRaw=state.tasksTab||(function(){try{return localStorage.getItem('crm_tasks_tab')||'free'}catch(e){return 'free'}})();
 const tab=tabRaw==='mine'?'work':tabRaw; // старый ключ «Мои» → «В работе»
 const own=DB.orders.filter(o=>o.worker===state.user&&visOrder(o)&&o.status!=='canceled');
 // «Доступные»: new/approved, исполнитель пуст или я; чужие взятые (inwork) скрыты
 const free=DB.orders.filter(o=>['new','approved'].includes(o.status)&&visOrder(o)&&(!o.worker||o.worker===state.user)&&!hiddenTakeFromMe(o)).sort((a,b)=>(urgentSoon(b)?1:0)-(urgentSoon(a)?1:0));
 const work=own.filter(o=>(isInwork(o)||o.status==='paused')&&!hiddenTakeFromMe(o));
 const doneT=own.filter(o=>['completed','paid'].includes(o.status));
 return `
<div class="header green"><h1>🔍 Поиск заказов</h1><span style="margin-left:auto;font-size:13px">${escapeHtml(state.user)} • <u onclick="logout()" style="cursor:pointer">выйти</u></span></div>
<div class="filters">
 <button class="fbtn ${tab==='free'?'active':''}" onclick="setTasksTab('free')">🆓 Доступные (${free.length})</button>
 <button class="fbtn ${tab==='work'?'active':''}" onclick="setTasksTab('work')">🚜 В работе (${work.length})</button>
 <button class="fbtn ${tab==='done'?'active':''}" onclick="setTasksTab('done')">✅ Завершённые (${doneT.length})</button>
</div>
${tab==='free'?`<div class="card">
  ${free.map(o=>`<div class="mat" style="${urgentSoon(o)?'background:#fef9c3;border-left:4px solid #f59e0b':''}"><b>${escapeHtml(o.client)}</b> <span class="muted">№${o.id}</span>
   <div class="muted">📍 ${escapeHtml(o.address)}<br>⏰ ${o.date.slice(8)}.${o.date.slice(5,7)} ${o.t1}–${o.t2}${urgentSoon(o)?' <b style="color:#b45309">⚡ скоро</b>':''}<br>${escapeHtml(o.desc)}</div>
   <div style="font-weight:700;color:var(--green);margin:6px 0">${money(total(o))}</div>
   ${showTakeBtn(o)?`<button class="btn btn-green" onclick="takeGateModal(${o.id})">🚜 Взять в работу</button>`:''}
   ${o.worker===state.user&&o.status==='approved'?`<button class="btn btn-blue" onclick="setStatus(${o.id},'inwork')">🚗 Приступил (я на адресе)</button>`:''}
   <button class="btn-sm btn-outline" style="margin-top:6px" onclick="go('details',${o.id})">ℹ️ Открыть</button></div>`).join('')||'<div class="muted">Свободных заявок нет</div>'}
 </div>`:tab==='work'?`
<div class="card"><div class="sec-title">🚜 Мои заказы в работе</div>
  ${work.map(o=>`
  <div class="mat" style="border-left:4px solid #f59e0b">
   <div style="cursor:pointer" onclick="go('details',${o.id})"><b>${escapeHtml(o.client)}</b> <span class="muted">№${o.id}</span>
   <div class="muted">📍 ${escapeHtml(o.address)}<br>⏰ ${o.date.slice(8)}.${o.date.slice(5,7)} ${o.t1}–${o.t2}</div>
   <div style="margin:4px 0">${badges(o)}</div>
   <div style="font-weight:700;color:var(--green)">${money(total(o))}</div></div>
   ${(o.stages||[]).length?`<div style="margin:6px 0">${stageTimeline(o,true)}</div>`:''}
   <button class="btn-sm btn-outline" style="margin-bottom:6px" onclick="routeScreen(${o.id})">🗺 Схема</button>
   <button class="btn-sm btn-outline" style="margin-bottom:6px" onclick="go('details',${o.id})">ℹ️ Открыть</button>
   ${isInwork(o)&&o.worker===state.user&&orderType(o)!=='manufacture'?`${allStagesReadyForComplete(o)?`<button class="btn btn-purple" onclick="finishOrder(${o.id})">✅ Завершить</button>`:(()=>{const st=o.stages||[];const leftIdx=st.findIndex(s=>s.id==='st_left');const leftDone=leftIdx>=0&&st[leftIdx].done;const hasUndoneAfter=st.slice(leftIdx+1).some(s=>!s.done&&!s.autoOnly);return leftDone&&hasUndoneAfter?`<button class="btn btn-yellow" onclick="pauseOrder(${o.id})">⏸ Пауза</button><button class="btn btn-red" style="flex:1" onclick="refuseOrder(${o.id})">🚫 Отказаться</button>`:`<button class="btn btn-blue" onclick="openSchemeTray(${o.id})">${o.startedTs?'▶ Продолжить':'▶ Приступить'}</button>`;})()}`:''}
   ${o.status==='paused'&&o.worker===state.user?`<button class="btn-sm btn-blue" onclick="resumeWork(${o.id})">▶ Возобновить работу</button>`:''}
  </div>`).join('')||'<div class="muted">Взятых заказов нет</div>'}
 </div>`:`
<div class="card"><div class="sec-title">✅ Завершённые (мои)</div>
  ${doneT.map(o=>`
  <div class="mat" style="cursor:pointer" onclick="go('details',${o.id})"><b>${escapeHtml(o.client)}</b> <span class="muted">№${o.id}</span> <span class="badge" style="background:${ST[o.status].c};color:${ST[o.status].tc}">${ST[o.status].t}</span>
  <div style="font-weight:700;color:var(--green)">${money(total(o))}</div></div>`).join('')||'<div class="muted">Пока пусто</div>'}
 </div>`}`}
function setTasksTab(t){state.tasksTab=t;try{localStorage.setItem('crm_tasks_tab',t)}catch(e){}render()}
function canShoppingCreate(){if(typeof can==='function')return isOwner()||can('shopping_create');return (typeof isOwner==='function'&&isOwner())||['admin'].includes(state.role)}
function canShoppingClose(){if(typeof can==='function')return isOwner()||can('shopping_close');return (typeof isOwner==='function'&&isOwner())||['admin'].includes(state.role)}
function shoppingForm(){
 if(!canShoppingCreate())return alert('Нет прав');
 const today=fmt(new Date());
 openModal(
  `<div style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px" onclick="if(event.target===this)closeModal()">
   <div style="background:#fff;border-radius:12px;max-width:340px;width:100%;padding:20px" onclick="event.stopPropagation()">
    <b style="display:block;margin-bottom:10px">🛒 Отдельный запрос на закупку</b>
    <input class="input" id="sq-name" placeholder="Наименование *" style="margin-bottom:8px">
    <div style="display:flex;gap:8px;margin-bottom:8px">
     <input class="input" id="sq-qty" placeholder="Кол-во *" value="1" style="flex:1">
     <input class="input" id="sq-unit" placeholder="Ед. (шт, м)" value="шт" style="flex:1">
     <input class="input" id="sq-price" placeholder="Ориент. цена" type="number" style="flex:1.4"></div>
    <input class="input" id="sq-vendor" placeholder="Поставщик (опционально)" style="margin-bottom:8px">
    <div style="display:flex;gap:8px;margin-bottom:8px">
     <label style="flex:1;font-size:12px">Нужно к:<input class="input" id="sq-due" type="date" value="${today}"></label></div>
    <textarea class="input" id="sq-note" placeholder="Комментарий" style="min-height:50px;margin-bottom:12px"></textarea>
    <div style="display:flex;gap:8px">
     <button class="btn-sm btn-outline" style="flex:1" onclick="closeModal()">Отмена</button>
     <button class="btn-sm btn-green" style="flex:1" onclick="shoppingCreate()">Создать запрос</button></div>
   </div></div>`);
 setTimeout(function(){var e=document.getElementById('sq-name');if(e)e.focus();},50);
}
function shoppingCreate(){
 if(!canShoppingCreate())return alert('Нет прав');
 const gv=function(id){var e=document.getElementById(id);if(!e)return '';var v=(e&&typeof e==='object'&&e.value!==undefined&&e.value!==null)?e.value:e;return String(v==null?'':v).trim();};
 const name=gv('sq-name');
 if(!name)return alert('Укажите наименование');
 const rec={id:'sq-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),
  source:'manual',status:'new',name:name,qty:gv('sq-qty')||'1',unit:gv('sq-unit'),
  price:+gv('sq-price')||0,vendor:gv('sq-vendor'),due:gv('sq-due'),note:gv('sq-note'),
  by:state.user,byName:state.user,ts:Date.now()};
 DB.shopping=DB.shopping||[];DB.shopping.push(rec);
 saveSettings();closeModal();
 if(typeof pushEvent==='function')pushEvent('material','🛒 Новый запрос на закуп','«'+name+'» — '+rec.qty+(rec.unit||'')+(rec.price?' • ~'+money(rec.price):''),null,true);
 render();
}
function shoppingBuy(id){
 const r=(DB.shopping||[]).find(x=>x.id===id);if(!r||r.status!=='new')return;
 if(!canShoppingClose())return alert('Нет прав');
 const fact=prompt('Фактическая цена (можно пусто):','');
 if(fact===null)return;
 r.status='bought';if(fact!=='')r.factPrice=+fact||0;r.dateBought=fmt(new Date());r.closedBy=state.user;r.closedTs=Date.now();
 saveSettings();
 if(typeof pushEvent==='function')pushEvent('material','✅ Закуплено: '+r.name,'Запрос закрыл '+state.user+(r.factPrice?' • факт. '+money(r.factPrice):''),null,true);
 render();
}
function shoppingCancel(id){
 const r=(DB.shopping||[]).find(x=>x.id===id);if(!r)return;
 if(!canShoppingClose())return alert('Нет прав');
 if(!confirm('Отменить запрос «'+r.name+'»?'))return;
 r.status='canceled';r.closedBy=state.user;r.closedTs=Date.now();
 saveSettings();
 if(typeof pushEvent==='function')pushEvent('material','❌ Запрос отменён: '+r.name,'Отменил '+state.user,null,true);
 render();
}

  ${canShoppingClose()?`<div style="display:flex;gap:6px;margin-top:8px">
   <button class="btn-sm btn-green" onclick="shoppingBuy('${r.id}')">✅ Закуплено</button>
   <button class="btn-sm btn-red" onclick="shoppingCancel('${r.id}')">❌ Отменить</button></div>`:''}
 </div>`).join('')}
</div>`:''}
<div class="card">
 ${rows.map(r=>`<div class="mat" style="border-left:4px solid ${r.s.tc}">
  <div class="mat-head"><span class="mat-name">${escapeHtml(r.m.name)} (${escapeHtml(r.m.qty)})</span>
  <span class="badge" style="background:${r.s.c};color:${r.s.tc}">${r.s.t}</span></div>
  <div class="muted">Заявка №${r.o.id} • ${escapeHtml(r.o.client)} • работы ${r.o.date.slice(8)}.${r.o.date.slice(5,7)} ${r.o.t1}<br>
  ${BUYER[r.m.buyer]} • 📍 ${escapeHtml(r.m.where||'—')} • ${money(r.m.price)}<br>
   ⏳ Дедлайн: за ${r.m.deadline} ${r.m.unit==='h'?'ч':'дн'} ${r.s.cd?'• <b data-tleft="'+r.o.id+':'+r.i+'" style="color:'+r.s.tc+'">'+r.s.cd+'</b>':''}</div>
  ${['todo','urgent','critical'].includes(r.s.k)?`<div style="display:flex;gap:6px;margin-top:8px">
   <button class="btn-sm btn-green" onclick="matAct(${r.o.id},${r.i},'bought')">✅ Куплено</button>
   <button class="btn-sm btn-red" onclick="matAct(${r.o.id},${r.i},'issue')">❌ Не найти</button></div>`:''}
 </div>`).join('')||'<div class="muted">Все материалы закуплены 🎉</div>'}
</div>
${closed.length?`<div class="card"><div class="sec-title">Закрытые запросы</div>
 ${closed.map(r=>`<div class="mat"><div class="mat-head"><span class="mat-name">${escapeHtml(r.name)} (${escapeHtml(r.qty)}${escapeHtml(r.unit||'')})</span>
 <span class="badge" style="background:${r.status==='bought'?'#d1fae5;color:#065f46':'#fee2e2;color:#991b1b'}">${r.status==='bought'?'✅ закуплено':'❌ отменено'}</span></div>
 <div class="muted">${r.status==='bought'?'факт. '+(r.factPrice?money(r.factPrice):'—')+(r.dateBought?' • '+r.dateBought.slice(8)+'.'+r.dateBought.slice(5,7):''):''}</div></div>`).join('')}
</div>`:''}`}

function csvCell(v){v=(v==null?'':String(v));return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csvDate(s){if(!s)return '';const p=String(s).split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:s}
function exportCsv(){
 const st=k=>(ST[k]||{}).t||k;
 const done=DB.orders.filter(o=>bizOrder(o)&&['completed','paid'].includes(o.status));
 const ws=DB.users.filter(u=>u.role==='worker').map(w=>{
  const mine=done.filter(o=>o.worker===w.name);const sum=mine.reduce((s,o)=>s+total(o),0);
  return [w.name,mine.length,sum,w.share,Math.round(sum*w.share/100)];
 });
 const L=[];
 L.push(['Работник','Заявок','Сумма','Доля, %','К выплате'].map(csvCell).join(';'));
 ws.forEach(r=>L.push(r.map(csvCell).join(';')));
 L.push('');
 L.push(['Дата','Клиент','Телефон','Адрес','Статус','Сумма','Исполнитель'].map(csvCell).join(';'));
 DB.orders.filter(bizOrder).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).forEach(o=>L.push([csvDate(o.date),o.client,o.phone,o.address,st(o.status),total(o),o.worker||''].map(csvCell).join(';')));
 L.push('');
 L.push(['ПЛАТЕЖИ'].map(csvCell).join(';'));
 L.push(['Дата','Заявка','Клиент','Тип','Метод','Сумма','Примечание'].map(csvCell).join(';'));
 const pays=[];
 DB.orders.filter(bizOrder).forEach(o=>orderPayments(o).forEach(p=>pays.push({o:o,p:p})));
 pays.sort((a,b)=>String(b.p.date).localeCompare(String(a.p.date)));
 pays.forEach(x=>L.push([csvDate(x.p.date),'№'+x.o.id,x.o.client,PAY_T[x.p.type]||x.p.type,PAY_M[x.p.method]||x.p.method,x.p.sum,x.p.note||''].map(csvCell).join(';')));
 L.push(['ИТОГО приход','','','','',pays.filter(x=>x.p.type!=='materials').reduce((s,x)=>s+(+x.p.sum||0),0),''].map(csvCell).join(';'));
 L.push(['ИТОГО на материалы','','','','',pays.filter(x=>x.p.type==='materials').reduce((s,x)=>s+(+x.p.sum||0),0),''].map(csvCell).join(';'));
 const blob=new Blob(['\uFEFF'+L.join('\r\n')],{type:'text/csv;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='otchet_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function realWorkers(){var demoIds=['u1','u2','u3','u4','u5'];var list=(DB.users||[]).filter(function(u){return u.role==='worker'&&demoIds.indexOf(u.id)<0;});if(typeof STAFF!=='undefined'&&STAFF&&STAFF.length){STAFF.forEach(function(s){var nm=s.name||s.deviceName||'';if(!nm)return;var isW=(s.roles&&s.roles.indexOf('worker')>=0)||s.role==='worker';if(!isW)return;if(!list.some(function(u){return u.name===nm;})){var nu={id:'w_'+(s.deviceId||nm),name:nm,role:'worker',share:0,deviceId:s.deviceId};DB.users.push(nu);list.push(nu);}});save();}return list;}

function renderFin(){

function delPhoto(id,i){
 const docs=(typeof PHOTOS_CACHE!=='undefined'&&PHOTOS_CACHE[id])||[];
 if(i<docs.length&&docs[i].id){
  const p=docs[i];
  if(!canDeletePhotoDoc(p))return alert('Нет прав');
  if(!confirm('Удалить фото?'))return;
  fs.collection('photos').doc(p.id).delete().then(function(){
   PHOTOS_CACHE[id]=docs.filter(function(x,xi){return xi!==i;}); go('details',id);
  }).catch(function(e){alert('Ошибка удаления: '+e.message);});
 } else {
  const oi=i-docs.length;
  if(!canDeletePhoto(byId(id)))return alert('Нет прав');
  if(!confirm('Удалить фото?'))return;
  const o=byId(id);o.photos.splice(oi,1);markOrder(o);save();go('details',id);
 }
}

// разбор полного адреса заявки «область, город, улица…» → {region,city} (или null)
function rcParseOrder(o){
 var a=(o&&o.address)||'';
 var list=rcList();
 for(var i=0;i<list.length;i++){
  var reg=list[i];
  if(a.indexOf(reg.region+', ')===0){
   var rest=a.slice(reg.region.length+2);
   var cm=rest.match(/^([^,]+),\s*/);
   if(cm&&reg.cities.indexOf(cm[1].trim())>=0)return{region:reg.region,city:cm[1].trim(),address:a};
   return{region:reg.region,city:'',address:a};
  }
 }
 return{region:'',city:'',address:a}; // старый адрес без справочника — «не добавлять»
}

function clientByName(name){
 if(!name)return null;
 const n=name.trim().toLowerCase();
 return (DB.clients||[]).find(c=>(c.name||'').trim().toLowerCase()===n);
}
function findClientByPhoneOrAddress(phone, address){
 DB.clients = DB.clients || [];
 const p = (phone||'').trim().toLowerCase();
 const a = (address||'').trim().toLowerCase();
 if(!p && !a) return null;
 return DB.clients.find(c => {
  const phones = (c.phones||[]).concat(c.phone?[c.phone]:[]).map(x=>(x||'').trim().toLowerCase());
  const addrs = (c.addresses||[]).concat(c.address?[c.address]:[]).map(x=>(x||'').trim().toLowerCase());
  if(p && phones.includes(p)) return true;
  if(a && addrs.includes(a)) return true;
  return false;
 });
}
function getOrCreateClient(name, phone, address){
 if(!name) return null;
 DB.clients = DB.clients || [];
 let c = clientByName(name);
 if(!c){
  const existing = findClientByPhoneOrAddress(phone, address);
  if(existing){
   c = existing;
   if(phone && !(c.phones||[]).includes(phone) && c.phone !== phone){
    c.phones = c.phones || [];
    if(c.phone && !c.phones.includes(c.phone)) c.phones.unshift(c.phone);
    c.phones.push(phone);
   }
   if(address && !(c.addresses||[]).includes(address) && c.address !== address){
    c.addresses = c.addresses || [];
    if(c.address && !c.addresses.includes(c.address)) c.addresses.unshift(c.address);
    c.addresses.push(address);
   }
   return c;
  }
  c = {id:'cl'+Date.now(), name:name.trim(), phone:phone||'', address:address||'', phones:phone?[phone]:[], addresses:address?[address]:[], notes:'', complaints:[]};
  DB.clients.push(c);
 } else {
  if(!c.phones && c.phone) c.phones = [c.phone];
  if(!c.addresses && c.address) c.addresses = [c.address];
  if(!c.phones) c.phones = [];
  if(!c.addresses) c.addresses = [];
  if(phone && !c.phones.includes(phone)){ c.phones.push(phone); if(!c.phone) c.phone = phone; }
  if(address && !c.addresses.includes(address)){ c.addresses.push(address); if(!c.address) c.address = address; }
 }
 return c;
}

 app.addEventListener('focusout',function(e){

  if(renderHoldEditable(n)&&app.contains(n))return;

 });

 app.addEventListener('change',function(e){
  if(!renderHoldEditable(e.target))return;

  setTimeout(renderHoldFlush,0);
 });
 // страховка для мобильных браузеров: тап по кнопке/пункту меню может не снимать focus с поля
 document.addEventListener('click',function(e){
  var tg=e.target&&e.target.tagName;

if(state.screen==='create'&&typeof worksRenderCreate==='function')worksRenderCreate();
 // A4: трей — единственный контейнер #scheme-tray, очищается перед каждым рендером
 var trayEl=document.getElementById('scheme-tray');
 var trayHandle=document.getElementById('tray-handle');
 if(trayEl&&trayHandle){
  if(state.schemeTray){
   const so=byId(state.schemeTray);if(so)ensureStages(so);
   if(so){
    document.getElementById('tray-body').innerHTML=
     '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-left:28px">'+
     '<b style="font-size:14px">Вы выполняете заказ №'+so.id+'</b></div>'+
     stageTimeline(so,true);
    trayEl.classList.add('open');
    trayHandle.style.display='none';
   } else {
    document.getElementById('tray-body').innerHTML='';
    trayEl.classList.remove('open');
    trayHandle.style.display='none';
    state.schemeTray=null;
   }
  } else {
   document.getElementById('tray-body').innerHTML='';
   trayEl.classList.remove('open');
   // A3: свёрнутый трей — узкая ручка «‹» у правого края
   trayHandle.style.display=state.trayCollapsed?'flex':'none';
  }
 }
 // восстановление прокрутки и фокуса (без сброса на верх при снапшотах/таймерах)
 requestAnimationFrame(function(){

 });

<script>
const APP_VERSION='2.1.7';
function updNote(v){return (v.text&&v.text.length)?v.text:('Плановое обновление №'+v.deploy+' от '+v.dt);}
function updStrip(on){document.getElementById('updStrip').style.display=on?'block':'none';document.body.style.paddingTop=on?'38px':'0';}
function updOpenModal(){var v=window.__updCur;if(!v)return;
 document.getElementById('updMTitle').textContent='Что нового? v'+v.version;
 document.getElementById('updMText').textContent='Обновление №'+v.deploy+' от '+v.dt+'\n\n'+updNote(v);
 document.getElementById('updMBtns').style.display='flex';
 document.getElementById('updMOk').style.display='none';
 document.getElementById('updOverlay').style.display='flex';}
function updCloseModal(){document.getElementById('updOverlay').style.display='none';}
(function(){
 document.getElementById('updNow').onclick=function(){var v=window.__updCur;if(v)localStorage.setItem('crm_ack',v.deploy);
  if('serviceWorker' in navigator){navigator.serviceWorker.getRegistration().then(function(r){if(r)r.update()});}
  setTimeout(function(){location.reload()},1200);};
 document.getElementById('updLate').onclick=function(){updCloseModal()};
 document.getElementById('updMOk').onclick=function(){updCloseModal()};
 document.getElementById('updOverlay').onclick=function(e){if(e.target===this)updCloseModal()};
 function check(){fetch('version.json?'+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(v){
  var ack=+(localStorage.getItem('crm_ack')||0), inf=+(localStorage.getItem('crm_info')||0);
  if((v.deploy||0)>ack){window.__updCur=v;updStrip(true);}
  else{updStrip(false);
   if((v.deploy||0)>inf){localStorage.setItem('crm_info',v.deploy);window.__updCur=v;
    document.getElementById('updMTitle').textContent='Что нового? v'+v.version;
    document.getElementById('updMText').textContent='Обновление №'+v.deploy+' от '+v.dt+'\n\n'+updNote(v);
    document.getElementById('updMBtns').style.display='none';
    document.getElementById('updMOk').style.display='block';
    document.getElementById('updOverlay').style.display='flex';}}
 }).catch(function(){});}
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
 check();setInterval(check,30000);
})();
</script>

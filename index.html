<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ServiceCRM</title>
<style>
:root{--blue:#2563eb;--green:#10b981;--red:#dc2626;--dark:#1e293b}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:#f5f5f5;max-width:430px;margin:0 auto;padding-bottom:72px;min-height:100vh}
.header{background:var(--blue);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.header.dark{background:var(--dark)}.header.green{background:var(--green)}.header.red{background:var(--red)}
.header h1{font-size:17px}
.back{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
.card{background:#fff;margin:12px 16px;padding:14px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sec-title{font-weight:600;font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.muted{font-size:12px;color:#666}
.badge{display:inline-block;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:600;margin:2px 4px 2px 0}
.role-card{border:1px solid #e5e5e5;border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.role-card:active{background:#f0f7ff}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;display:flex;border-top:1px solid #e5e5e5;z-index:10}
.nav-item{flex:1 1 0;min-width:0;text-align:center;padding:8px 2px;cursor:pointer;color:#666;font-size:10px}
.nav-item span{display:block;font-size:20px}
.nav-item.active{color:var(--blue)}
@media (max-width:380px){#nav .nav-item{padding:6px 1px;font-size:9px}#nav .nav-item span{font-size:18px}}
@media (max-width:330px){#nav .nav-item{padding:6px 0;font-size:8px}#nav .nav-item span{font-size:16px}}
.input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;background:#fff}
textarea.input{min-height:60px;resize:vertical}
.label{display:block;font-weight:500;font-size:13px;margin-bottom:5px;color:#333}
.field{margin-bottom:12px}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}
.btn-blue{background:var(--blue);color:#fff}.btn-green{background:var(--green);color:#fff}
.btn-red{background:#fee2e2;color:#991b1b}.btn-purple{background:#8b5cf6;color:#fff}
.btn-outline{background:#fff;border:1px solid var(--blue);color:var(--blue)}
.btn-sm{padding:8px 10px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{padding:6px 11px;border:1px solid var(--blue);color:var(--blue);border-radius:14px;font-size:12px;cursor:pointer;background:#fff;user-select:none}
.chip.sel{background:var(--blue);color:#fff}
.mat{border:1px solid #eee;border-radius:8px;padding:10px;margin-bottom:8px}
.mat-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.mat-name{font-weight:600;font-size:13px}
.ord{background:#fff;margin:10px 16px;padding:14px;border-radius:12px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ord:active{transform:scale(.99)}
.filters{display:flex;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid #eee;overflow-x:auto}
.fbtn{padding:6px 12px;border:1px solid #ddd;border-radius:16px;background:#fff;font-size:12px;cursor:pointer;white-space:nowrap}
.fbtn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.info-row{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;border-bottom:1px solid #f5f5f5}
.info-row:last-child{border:none}
.total{display:flex;justify-content:space-between;padding:8px 0;font-weight:700;font-size:16px;border-top:2px solid #eee;margin-top:6px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photo{width:64px;height:64px;border-radius:8px;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:22px}
.photo-add{border:2px dashed var(--blue);background:#fff;color:var(--blue);cursor:pointer}
.slot{border:1px solid #eee;border-radius:8px;padding:10px;margin-bottom:8px;border-left:4px solid #ccc}
.switch{position:relative;width:44px;height:25px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#ccc;border-radius:25px;transition:.2s;cursor:pointer}
.slider:before{content:'';position:absolute;height:19px;width:19px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
input:checked+.slider{background:var(--green)}
input:checked+.slider:before{transform:translateX(19px)}
.tgl{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #f0f0f0}
h1,h2,h3{font-weight:600}
</style>

<script>
// === BOOT-GUARD: самовосстановление при битом кэше SW ===
// Фатальная ошибка на этапе загрузки (до старта SDK) + флаг crm_recovered отсутствует
// → чистим ВСЕ кэши и перезагружаемся один раз. Вторая попытка не делается.
(function(){
 var RECOVER_FLAG='crm_recovered';
 function showFatal(){
  try{
   document.getElementById('app').innerHTML='<div class="card" style="text-align:center;padding:28px 16px;margin-top:40px">'+
    '<div style="font-size:40px">📡</div><div style="font-weight:700;margin:10px 0">Ошибка загрузки</div>'+
    '<div class="muted">Проверьте интернет и перезагрузите страницу.<br>Если не помогает — обновите приложение или обратитесь к владельцу.</div>'+
    '<button class="btn btn-blue" style="margin-top:12px" onclick="location.reload()">🔄 Перезагрузить</button></div>';
  }catch(e){}
 }
 window.onerror=function(msg,src,line,col,err){
  if(sessionStorage.getItem(RECOVER_FLAG)==='1'){ showFatal(); return false; }
  // ошибки сети (Failed to fetch, NetworkError, ERR_INTERNET) — штатный офлайн, НЕ фатальны
  var m=String(msg||'');
  if(/Failed to fetch|NetworkError|network|ERR_INTERNET|ERR_NETWORK|ERR_CONNECTION|The internet connection|Load failed/i.test(m))return false;
  // считаем фатальной ошибку в основном скрипте приложения (не в сторонних SDK)
  var fatal=!src||src.indexOf('firebase')<0;
  if(!fatal)return false;
  sessionStorage.setItem(RECOVER_FLAG,'1');
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){
   navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(r){ try{r.unregister();}catch(e){} });
   }).catch(function(){});
  }
  if(window.caches&&caches.keys){
   caches.keys().then(function(ks){
    return Promise.all(ks.map(function(k){return caches.delete(k);}));
   }).then(function(){ location.reload(); }).catch(function(){ location.reload(); });
  } else location.reload();
  return true;
 };
})();
</script>
<script>

    {name:'Кронштейны усиленные',qty:'2 шт',price:1200,buyer:'worker',where:'Строймаркет',deadline:3,unit:'h',status:'todo'}]},
  {id:251,client:'Петров Петр',phone:'+7(901)222-33-44',address:'ул. Мира, 8',desc:'Замена розеток, 5 шт',
   status:'approved',date:d1,t1:'10:00',t2:'12:00',price:7500,extras:[],photoReport:false,worker:'Вася',photos:[],
   materials:[{name:'Розетки Legrand',qty:'5 шт',price:2500,buyer:'worker',where:'Электромир',deadline:12,unit:'h',status:'todo'}]},
  {id:264,client:'Сидоров Сидор',phone:'+7(902)333-44-55',address:'ул. Гагарина, 3',desc:'Обслуживание вентиляции',
   status:'approved',date:d7,t1:'12:00',t2:'14:00',price:6500,extras:[],photoReport:true,worker:null,photos:[],
   materials:[{name:'Фильтр воздушный F5',qty:'2 шт',price:1800,buyer:'delivery',where:'Склад поставщика → адрес',deadline:2,unit:'d',status:'delivery'}]},
  {id:266,client:'Козлова Анна',phone:'+7(903)444-55-66',address:'пр. Победы, 42',desc:'Осмотр перед установкой сплит-системы',
   status:'inspection',date:d0,t1:'17:00',t2:'18:00',price:1500,extras:[],photoReport:true,worker:'Анна',photos:[],materials:[]},
  {id:240,client:'Николаев Н.Н.',phone:'+7(904)555-66-77',address:'ул. Садовая, 1',desc:'Установка кондиционера',

 ]};}
let DB,state={role:null,user:null,screen:'orders',orderId:null,filter:'all',calDate:d0,newMats:[]};
function load(){try{DB=JSON.parse(localStorage.getItem('crm_db'))||defaultData()}catch(e){DB=defaultData()}}
function save(){localStorage.setItem('crm_db',JSON.stringify(DB));
 // облачная запись: window.save сам смотрит state.__mutOrder (заявка → её документ, иначе настройки)
 if(typeof window.save==='function')window.save();
}
function markOrder(o){state.__mutOrder=o}
function reset(){localStorage.removeItem('crm_db');load();render();alert('Демо-данные сброшены')}
load();
const money=n=>(+n||0).toLocaleString('ru')+' ₽';
const total=o=>(+o.price||0)+o.extras.reduce((s,e)=>s+(+e.price||0),0);
// === ТИПЫ ЗАЯВКИ, ЭТАПЫ, ПЛАТЕЖИ ===
const OTYPE={standard:'Стандарт',manufacture:'С изготовлением',service:'Сервисный'};
const STAGE_T={measure:'Замер',make:'Изготовление',install:'Монтаж',repair:'Ремонт',service:'Выезд'};
const PAY_T={advance:'Аванс',partial:'Частичный',full:'Полный',materials:'На материалы'};
const PAY_M={cash:'Наличные',card:'Карта',transfer:'Перевод'};
function orderType(o){return o.type||'standard'}
function orderStages(o){return (orderType(o)==='manufacture'&&o.stages)||[]}
function orderPayments(o){return o.payments||[]}
function totalPaid(o){return orderPayments(o).filter(p=>p.type!=='materials').reduce((s,p)=>s+(+p.sum||0),0)}
function materialsPaid(o){return orderPayments(o).filter(p=>p.type==='materials').reduce((s,p)=>s+(+p.sum||0),0)}
function balance(o){return total(o)-totalPaid(o)}
function canFinance(){if(typeof can==='function')return isOwner()||can('finance_edit');return ['admin'].includes(state.role)}
function stageDefault(type){
 if(type==='manufacture')return [
  {id:'st1',type:'measure',title:'Замер',dueMode:'date',plan_start:'',plan_ready:'',done:false,by:'',ts_done:null},
  {id:'st2',type:'make',title:'Изготовление',dueMode:'date',plan_start:'',plan_ready:'',done:false,by:'',ts_done:null},
  {id:'st3',type:'install',title:'Монтаж',dueMode:'date',plan_start:'',plan_ready:'',done:false,by:'',ts_done:null}];
 if(type==='service')return [{id:'st1',type:'service',title:'Выезд',dueMode:'ready',plan_start:'',plan_ready:'',done:false,by:'',ts_done:null}];
 return [];
}
function stageDueLabel(s){
 if(s.dueMode==='ready')return 'по готовности';
 if(s.dueMode==='agree')return 'по договорённости';
 return (s.plan_start?'с '+s.plan_start:'—')+(s.plan_ready?' до '+s.plan_ready:'');
}
function currentStage(o){return orderStages(o).find(s=>!s.done)}
function stageTimeline(o,editable){
 var st=orderStages(o);
 if(!st.length)return '';
 var html='<div style="margin-top:8px">';
 st.forEach(function(s,i){
  var icon=s.done?'✅':(i===0||st[i-1].done)?'🟡':'⚪';
  html+='<div style="border-left:3px solid '+(s.done?'var(--green)':(i===0||st[i-1].done)?'var(--blue)':'#ddd')+';margin-left:8px;padding:6px 0 6px 12px">'+
   '<div class="mat-head"><b>'+icon+' '+(editable?'<span style="cursor:pointer;border-bottom:1px dashed #94a3b8" onclick="stageRename('+o.id+','+i+')">'+escapeHtml(s.title||STAGE_T[s.type]||s.type)+' ✏️</span>':escapeHtml(s.title||STAGE_T[s.type]||s.type))+'</b>'+
   (editable?'<span style="display:flex;gap:4px">'+(i>0?'<span class="btn-sm btn-outline" style="cursor:pointer;padding:2px 6px" onclick="stageMove('+o.id+','+i+',-1)">↑</span>':'')+
    (i<st.length-1?'<span class="btn-sm btn-outline" style="cursor:pointer;padding:2px 6px" onclick="stageMove('+o.id+','+i+',1)">↓</span>':'')+
    '<span style="cursor:pointer;color:var(--red)" onclick="stageDel('+o.id+','+i+')">✕</span></span>':'')+'</div>'+
   '<div class="muted">Срок: '+escapeHtml(stageDueLabel(s))+(s.by?' • исполнитель: '+escapeHtml(s.by):'')+'</div>'+
   (s.ts_done?'<div class="muted">✅ Готово: '+new Date(s.ts_done).toLocaleString()+'</div>':'')+
   (editable&&!s.done&&(i===0||st[i-1].done)?`<div style="display:flex;gap:6px;margin-top:6px">
    ${!s.plan_start&&s.by?`<button class="btn-sm btn-blue" onclick="stageStart(${o.id},${i})">▶ Приступить</button>`:''}
    <button class="btn-sm btn-green" onclick="stageDone(${o.id},${i})">✅ Этап готов</button></div>`:'')+
  '</div>';
 });
 if(editable)html+='<button class="btn-sm btn-outline" style="margin-top:8px" onclick="stageAdd('+o.id+')">＋ Этап</button>';
 return html+'</div>';
}
function stageRename(id,i){
 const o=byId(id);if(!canEditRoute(o))return;
 const s=orderStages(o)[i];if(!s)return;
 const t=prompt('Название этапа:',s.title||'');if(t===null)return;
 s.title=t.trim()||s.title;markOrder(o);save();render();
}
function stageDue(id,i){
 const o=byId(id);if(!canEditRoute(o))return;
 const s=orderStages(o)[i];if(!s)return;
 const v=prompt('Срок этапа:\n1 — дата\n2 — по готовности\n3 — по договорённости','1');
 if(v==='2'){s.dueMode='ready';}
 else if(v==='3'){s.dueMode='agree';}
 else if(v==='1'){s.dueMode='date';const d=prompt('Плановая готовность (ГГГГ-ММ-ДД):',s.plan_ready||'');if(d)s.plan_ready=d;}
 else return;
 markOrder(o);save();render();
}
function stageStart(id,i){const o=byId(id);const s=orderStages(o)[i];if(!s)return;s.plan_start=s.plan_start||new Date().toISOString().slice(0,10);s.by=s.by||deviceId();markOrder(o);save();render()}
function stageDone(id,i){
 const o=byId(id);const st=orderStages(o);const s=st[i];if(!s)return;
 s.done=true;s.ts_done=Date.now();
 var nxt=st[i+1];
 markOrder(o);save();render();
 if(typeof pushEvent==='function'&&nxt&&nxt.by)pushEvent('stage','✅ Этап «'+escapeHtml(s.title)+'» готов — заявка №'+o.id,'Следующий этап: '+escapeHtml(nxt.title||'')+' — для '+escapeHtml(nxt.by),o.id);
}
function stageMove(id,i,d){const o=byId(id);if(!canEditRoute(o))return;const st=o.stages;const j=i+d;if(j<0||j>=st.length)return;const t=st[i];st[i]=st[j];st[j]=t;markOrder(o);save();render()}
function stageDel(id,i){const o=byId(id);if(!canEditRoute(o))return;if(!confirm('Удалить этап?'))return;o.stages.splice(i,1);markOrder(o);save();render()}
function stageAdd(id){
 const o=byId(id);if(!canEditRoute(o))return;
 const t=prompt('Название этапа:');if(!t)return;
 o.stages.push({id:'st'+Date.now(),type:'custom',title:t,plan_start:'',plan_ready:'',done:false,by:'',ts_done:null});
 markOrder(o);save();render();
}
function paymentsBlock(o){
 var pays=orderPayments(o);
 var canW=canFinance();
 var html='<div class="card"><div class="sec-title">💰 Платежи</div>'+
  '<div class="info-row"><span class="muted">Сумма заказа (с доп. работами)</span><b>'+money(total(o))+'</b></div>'+

  '<div class="info-row"><span class="muted">Аванс на материалы (выдан)</span><b>'+money(materialsPaid(o))+'</b></div>';
 if(pays.length){
  html+='<div style="margin-top:8px;border-top:1px solid #eee;padding-top:8px">';
  pays.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).forEach(function(p){
   html+='<div class="info-row"><span>'+(p.type==='materials'?'📤':'📥')+' '+PAY_T[p.type]+' • '+(PAY_M[p.method]||p.method)+'<br><span class="muted">'+(p.date||'')+(p.note?' • '+escapeHtml(p.note):'')+'</span></span><b style="color:'+(p.type==='materials'?'var(--red)':'var(--green)')+'">'+(p.type==='materials'?'-':'')+money(p.sum)+'</b></div>';
  });
  html+='</div>';
 }
 if(canW)html+='<div class="row2" style="margin-top:10px"><button class="btn-sm btn-green" onclick="payModal('+o.id+',\'in\')">＋ Приход</button><button class="btn-sm btn-red" onclick="payModal('+o.id+',\'materials\')">＋ Выдать на материалы</button></div>';
 return html+'</div>';
}
function payModal(id,dir){
 const o=byId(id);
 const types=dir==='materials'?['materials']:['advance','partial','full'];
 document.getElementById('app').insertAdjacentHTML('beforeend',
  `<div style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px" onclick="if(event.target===this)this.remove()">
   <div style="background:#fff;border-radius:12px;max-width:340px;width:100%;padding:20px" onclick="event.stopPropagation()">
    <b style="display:block;margin-bottom:10px">${dir==='materials'?'📤 Выдать на материалы':'📥 Приход'}</b>
    <select class="input" id="pay-type" style="margin-bottom:8px">${types.map(t=>`<option value="${t}">${PAY_T[t]}</option>`).join('')}</select>
    <input class="input" id="pay-sum" type="number" placeholder="Сумма ₽ *" style="margin-bottom:8px">
    <select class="input" id="pay-method" style="margin-bottom:8px">${Object.keys(PAY_M).map(m=>`<option value="${m}">${PAY_M[m]}</option>`).join('')}</select>

function dur(ms){const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);return h>=24?Math.floor(h/24)+' д '+(h%24)+' ч':h+' ч '+m+' мин';}

function matState(o,m){
 if(m.status==='bought')return{k:'bought',t:'✅ Закуплен',c:'#d1fae5',tc:'#065f46',cd:''};
 if(m.status==='delivery')return{k:'delivery',t:'🚚 В доставке',c:'#dbeafe',tc:'#1e40af',cd:''};
 if(m.status==='issue')return{k:'issue',t:'❌ Не найден',c:'#fee2e5',tc:'#991b1b',cd:'нужно решение'};
 if(!o.date)return{k:'todo',t:'📋 К закупке',c:'#f0fdf4',tc:'#065f46',cd:'без срока'};
 const work=new Date(o.date+'T'+(o.t1||'09:00')).getTime();
 const dl=work-(m.unit==='h'?m.deadline:m.deadline*24)*36e5;
 const diff=dl-Date.now();
 if(diff<0)return{k:'critical',t:'🔴 Критично',c:'#fee2e2',tc:'#991b1b',cd:'просрочен на '+dur(-diff)};
 if(diff<3*36e5)return{k:'urgent',t:'⏳ Срок наступает',c:'#fef3c7',tc:'#92400e',cd:'осталось '+dur(diff)};
 return{k:'todo',t:'📋 К закупке',c:'#f0fdf4',tc:'#065f46',cd:'осталось '+dur(diff)};
}

 });

function csvCell(v){v=(v==null?'':String(v));return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csvDate(s){if(!s)return '';const p=String(s).split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:s}
function exportCsv(){
 const st=k=>(ST[k]||{}).t||k;
 const done=DB.orders.filter(o=>['completed','paid'].includes(o.status));
 const ws=DB.users.filter(u=>u.role==='worker').map(w=>{
  const mine=done.filter(o=>o.worker===w.name);const sum=mine.reduce((s,o)=>s+total(o),0);
  return [w.name,mine.length,sum,w.share,Math.round(sum*w.share/100)];
 });
 const L=[];
 L.push(['Работник','Заявок','Сумма','Доля, %','К выплате'].map(csvCell).join(';'));
 ws.forEach(r=>L.push(r.map(csvCell).join(';')));
 L.push('');
 L.push(['Дата','Клиент','Телефон','Адрес','Статус','Сумма','Исполнитель'].map(csvCell).join(';'));
 DB.orders.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).forEach(o=>L.push([csvDate(o.date),o.client,o.phone,o.address,st(o.status),total(o),o.worker||''].map(csvCell).join(';')));
 L.push('');
 L.push(['ПЛАТЕЖИ'].map(csvCell).join(';'));
 L.push(['Дата','Заявка','Клиент','Тип','Метод','Сумма','Примечание'].map(csvCell).join(';'));
 const pays=[];
 DB.orders.forEach(o=>orderPayments(o).forEach(p=>pays.push({o:o,p:p})));
 pays.sort((a,b)=>String(b.p.date).localeCompare(String(a.p.date)));
 pays.forEach(x=>L.push([csvDate(x.p.date),'№'+x.o.id,x.o.client,PAY_T[x.p.type]||x.p.type,PAY_M[x.p.method]||x.p.method,x.p.sum,x.p.note||''].map(csvCell).join(';')));
 L.push(['ИТОГО приход','','','','',pays.filter(x=>x.p.type!=='materials').reduce((s,x)=>s+(+x.p.sum||0),0),''].map(csvCell).join(';'));
 L.push(['ИТОГО на материалы','','','','',pays.filter(x=>x.p.type==='materials').reduce((s,x)=>s+(+x.p.sum||0),0),''].map(csvCell).join(';'));
 const blob=new Blob(['\uFEFF'+L.join('\r\n')],{type:'text/csv;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='otchet_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

function finishOrder(id){const o=byId(id);
 // manufacture: заказ завершается, когда все этапы готовы
 if(orderType(o)==='manufacture'&&orderStages(o).length){
  const und=orderStages(o).filter(s=>!s.done);
  if(und.length)return alert('⚠ Не все этапы готовы: осталось '+und.length+' ('+und.map(s=>s.title).join(', ')+')');
 }
 // кассовое закрытие: при остатке > 0 — модалка
 if(balance(o)>0){closeOrderModal(id);return}
 doCompleteOrder(id);
}
function closeOrderModal(id){
 const o=byId(id);
 const rows=[{n:'Основная работа',s:+o.price||0}].concat((o.extras||[]).map(e=>({n:e.name,s:+e.price||0})));
 const pays=orderPayments(o).filter(p=>p.type!=='materials');
 const hadPays=pays.length>0;
 const bal=balance(o);
 document.getElementById('app').insertAdjacentHTML('beforeend',
  `<div style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px" onclick="if(event.target===this)this.remove()">
   <div style="background:#fff;border-radius:12px;max-width:360px;width:100%;padding:20px" onclick="event.stopPropagation()">
    <b style="display:block;margin-bottom:10px">🧾 Закрытие заказа №${o.id}</b>
    ${rows.map(r=>`<div class="info-row"><span>${escapeHtml(r.n)}</span><b>${money(r.s)}</b></div>`).join('')}
    <div class="info-row" style="border-top:1px solid #eee;margin-top:6px;padding-top:6px"><span><b>Итого</b></span><b>${money(total(o))}</b></div>
    <div class="info-row"><span class="muted">Оплачено</span><b style="color:var(--green)">${money(totalPaid(o))}</b></div>
    <div class="info-row"><span class="muted">Остаток</span><b style="color:var(--red)">${money(bal)}</b></div>
    <button class="btn btn-green" style="width:100%;margin-top:12px" onclick="closeOrderPay(${o.id})">✅ Заказчик внёс остаток (${money(bal)})</button>
    ${!hadPays?`<button class="btn btn-blue" style="width:100%;margin-top:8px" onclick="closeOrderFull(${o.id})">💵 Оплачено полностью (${money(total(o))})</button>`:''}
    <button class="btn" style="width:100%;background:#f3f4f6;color:#374151;margin-top:8px" onclick="this.closest('div[style*=z-index]').remove()">Отмена</button>
   </div></div>`);
}
function closeOrderPay(id){
 const o=byId(id);if(!canFinance())return alert('Нет прав');
 const bal=balance(o);
 if(bal<=0)return closeOrderModalRemove(id);
 o.payments=o.payments||[];
 o.payments.push({id:'p'+Date.now(),sum:bal,type:'full',method:'cash',date:new Date().toISOString().slice(0,10),note:'при закрытии'});
 markOrder(o);save();
 closeOrderModalRemove(id);
 if(typeof pushEvent==='function')pushEvent('stage','📥 Платёж получен — заявка №'+o.id,money(bal)+' (остаток при закрытии), баланс '+money(balance(o)),o.id);
 doCompleteOrder(id);
}
function closeOrderFull(id){
 const o=byId(id);if(!canFinance())return alert('Нет прав');
 o.payments=o.payments||[];
 o.payments.push({id:'p'+Date.now(),sum:total(o),type:'full',method:'cash',date:new Date().toISOString().slice(0,10),note:'оплата полностью при закрытии'});
 markOrder(o);save();
 closeOrderModalRemove(id);
 if(typeof pushEvent==='function')pushEvent('stage','📥 Платёж получен — заявка №'+o.id,money(total(o))+' (полная оплата при закрытии)',o.id);
 doCompleteOrder(id);
}
function closeOrderModalRemove(){const m=document.querySelector('#app > div[style*="z-index:99"]');if(m)m.remove()}
function doCompleteOrder(id){const o=byId(id);
 if(o.photoReport){
  orderHasPhotos(id,function(has){ if(!has){alert('⚠ По этой заявке нужен фотоотчет. Добавьте хотя бы одно фото.');go('details',id);return;}
   o.status='completed';markOrder(o);save();alert('Заказ №'+id+' выполнен! Ожидает оплаты.');render(); });
  return;
 }
 o.status='completed';markOrder(o);save();alert('Заказ №'+id+' выполнен!');render()}
function canAddPhoto(o){if(typeof can==='function')return can('orders_edit')||o.worker===state.user;if(!['admin','operator','manager'].includes(state.role))return o.worker===state.user;return true}
function viewPhoto(id,i){
 const docs=(typeof PHOTOS_CACHE!=='undefined'&&PHOTOS_CACHE[id])||[];
 const all=docs.concat(byId(id)?byId(id).photos||[]:[]);
 const p=all[i]; if(!p)return;
 const src=(p&&p.data)?p.data:p;
 const real=typeof src==='string'&&(src.indexOf('data:image/')===0||src.indexOf('http')===0);
 const img=real?'<img src="'+src+'" style="max-width:100%;border-radius:12px">':'<div style="width:220px;height:220px;margin:0 auto;background:#f3f4f6;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:40px">📷</div>';
 const canDel=(p&&p.id)?canDeletePhotoDoc(p):canDeletePhoto(byId(id));
 const del=canDel?`<button class="btn btn-red" style="margin:12px 0" onclick="delPhoto(${id},${i})">🗑 Удалить фото</button>`:'';
 document.getElementById('app').innerHTML=`<div class="header dark"><button class="back" onclick="go('details',${id})">←</button><h1>Фото</h1></div><div style="text-align:center;padding:16px">${img}${del?'<div>'+del+'</div>':''}</div>`}
function canDeletePhoto(o){if(typeof can==='function')return isOwner()||can('orders_delete');return ['admin'].includes(state.role)}
function delPhoto(id,i){
 const docs=(typeof PHOTOS_CACHE!=='undefined'&&PHOTOS_CACHE[id])||[];
 if(i<docs.length&&docs[i].id){
  const p=docs[i];
  if(!canDeletePhotoDoc(p))return alert('Нет прав');
  if(!confirm('Удалить фото?'))return;
  fs.collection('photos').doc(p.id).delete().then(function(){
   PHOTOS_CACHE[id]=docs.filter(function(x,xi){return xi!==i;}); go('details',id);
  }).catch(function(e){alert('Ошибка удаления: '+e.message);});
 } else {
  const oi=i-docs.length;
  if(!canDeletePhoto(byId(id)))return alert('Нет прав');
  if(!confirm('Удалить фото?'))return;
  const o=byId(id);o.photos.splice(oi,1);markOrder(o);save();go('details',id);
 }
}
function matAct(id,i,st){const o=byId(id);o.materials[i].status=st;
 if(st==='issue'&&!['completed','paid'].includes(o.status)){o.status='waiting';alert('Материал отмечен «Не найден». Заявка → «Ожидание материала». Требуется решение админа.')}
 else if(st==='issue'){alert('Материал отмечен «Не найден». Заявка уже закрыта — статус не изменён, требуется решение админа.')}
 markOrder(o);save();render()}

function delExtra(id,i){if(confirm('Удалить доп. работу?')){byId(id).extras.splice(i,1);markOrder(byId(id));save();render()}}
function addMat(id){const g=x=>document.getElementById(x).value;
 if(!g('mf-name'))return alert('Введите наименование');
 byId(id).materials.push({name:g('mf-name'),qty:g('mf-qty')||'1',price:+g('mf-price')||0,buyer:g('mf-buyer'),where:g('mf-where'),deadline:+g('mf-dl')||3,unit:g('mf-unit'),status:'todo'});
 markOrder(byId(id));save();render()}
function addNewMat(){const g=x=>document.getElementById(x).value;
 if(!g('nm-name'))return alert('Введите наименование');
 state.newMats.push({name:g('nm-name'),qty:g('nm-qty')||'1',price:+g('nm-price')||0,buyer:g('nm-buyer'),where:g('nm-where'),deadline:+g('nm-dl')||3,unit:g('nm-unit'),status:'todo'});
 ['nm-name','nm-qty','nm-price','nm-where'].forEach(x=>document.getElementById(x).value='');
 document.getElementById('newmats').innerHTML=state.newMats.map((m,i)=>`<div class="mat"><div class="mat-head"><span class="mat-name">${escapeHtml(m.name)} (${escapeHtml(m.qty)})</span><span style="color:var(--red);cursor:pointer" onclick="state.newMats.splice(${i},1);renderCreate2()">✕</span></div><div class="muted">${money(m.price)} • ${BUYER[m.buyer]} • за ${m.deadline} ${m.unit==='h'?'ч':'дн'} до работ</div></div>`).join('');
 document.getElementById('matcount').textContent=state.newMats.length?'('+state.newMats.length+')':'';}
function renderCreate2(){document.getElementById('newmats').innerHTML=state.newMats.map((m,i)=>`<div class="mat"><div class="mat-head"><span class="mat-name">${escapeHtml(m.name)} (${escapeHtml(m.qty)})</span><span style="color:var(--red);cursor:pointer" onclick="state.newMats.splice(${i},1);renderCreate2()">✕</span></div><div class="muted">${money(m.price)} • ${BUYER[m.buyer]}</div></div>`).join('')}
function tplClick(i){const el=document.getElementById('tpl'+i),ta=document.getElementById('c-desc');
 el.classList.toggle('sel');const t=DB.templates[i];
 ta.value=el.classList.contains('sel')?(ta.value?ta.value+'; '+t.name:t.name):ta.value.split('; ').filter(x=>x!==t.name).join('; ');}
function setDur(h,el){el.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');
 const t1=document.getElementById('c-t1').value||'14:00';const p=t1.split(':');const start=(+p[0])*60+(+p[1]||0);
 const end=Math.min(start+h*60,23*60+59);
 document.getElementById('c-t2').value=String(Math.floor(end/60)).padStart(2,'0')+':'+String(end%60).padStart(2,'0');}
function toMin(t){if(!t)return null;const p=String(t).split(':');return (+p[0])*60+(+p[1]||0)}
function findConflicts(worker,date,t1,t2,skipId){
 if(!worker||!date)return [];
 const s1=toMin(t1),e1=toMin(t2);
 if(s1==null||e1==null)return [];
 return DB.orders.filter(o=>o.id!==skipId&&o.worker===worker&&o.date===date&&['new','inspection','approved','in_progress','waiting','postponed'].includes(o.status))
  .filter(o=>{const s2=toMin(o.t1),e2=toMin(o.t2);return s2!=null&&e2!=null&&s1<e2&&s2<e1;});
}
function canOverrideConflict(){if(typeof can==='function')return isOwner()||can('orders_edit');return ['admin'].includes(state.role)}
function saveOrder(){const g=x=>document.getElementById(x).value;
 if(!g('c-client')||!g('c-phone')||!g('c-address'))return alert('Заполните клиента, телефон и адрес');
 const worker=g('c-worker')||null,date=g('c-date'),t1=g('c-t1'),t2=g('c-t2');
 const conf=worker?findConflicts(worker,date,t1,t2,null):[];
 if(conf.length){
  const c=conf[0];
  const canOv=canOverrideConflict();
  document.getElementById('app').insertAdjacentHTML('beforeend',
   `<div style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px">
    <div style="background:#fff;border-radius:12px;max-width:340px;width:100%;padding:20px;text-align:center">
     <div style="font-size:34px">⚠️</div>
     <b style="display:block;margin:8px 0">Исполнитель занят ${c.t1||'?'}–${c.t2||'?'} (${escapeHtml(c.client)})</b>
     <div class="muted" style="margin-bottom:14px">Заявок с пересечением: ${conf.length}</div>
     ${canOv?`<button class="btn btn-blue" style="width:100%" onclick="doSaveOrder(true)">Всё равно назначить</button>`:''}
     <button class="btn" style="width:100%;background:#f3f4f6;color:#374151;margin-top:8px" onclick="closeConflictModal()">Отмена</button>
    </div></div>`);
  return;
 }
 doSaveOrder(false);
}
function closeConflictModal(){const m=document.querySelector('#app > div[style*="z-index:99"]');if(m)m.remove()}
function doSaveOrder(force){const g=x=>document.getElementById(x).value;
 if(!force)closeConflictModal();
 const otype=document.getElementById('c-otype')?document.getElementById('c-otype').value:'standard';
 const o={id:++DB.seq,client:g('c-client'),phone:g('c-phone'),address:g('c-address'),desc:g('c-desc'),
  status:g('c-type'),date:g('c-date'),t1:g('c-t1'),t2:g('c-t2'),price:+g('c-price')||0,extras:[],
  photoReport:document.getElementById('c-photo').checked,worker:g('c-worker')||null,
  materials:state.newMats.slice(),photos:[],type:otype,payments:[]};
 if(otype!=='standard')o.stages=(state.cStages||[]).slice();
 DB.orders.unshift(o);
 if(typeof orderSave==='function')orderSave(o);else{markOrder(o);save();}
 if(typeof saveSettings==='function')saveSettings();
 alert('Заявка №'+DB.seq+' создана');go('orders')}

function cStageAdd(){state.cStages.push({id:'st'+Date.now(),type:'custom',title:'Этап '+(state.cStages.length+1),plan_start:'',plan_ready:'',done:false,by:'',ts_done:null});cStageRender()}
function cStageDel(i){state.cStages.splice(i,1);cStageRender()}
function cStageRender(){
 document.getElementById('c-stages').innerHTML=state.cStages.map(function(s,i){
  return '<div class="mat"><div class="mat-head"><b>'+escapeHtml(s.title)+'</b>'+(state.cStages.length>1?'<span style="cursor:pointer;color:var(--red)" onclick="cStageDel('+i+')">✕</span>':'')+'</div>'+
   '<select class="input" style="margin-top:6px" onchange="cStageDue('+i+',this.value)">'+
   '<option value="date"'+(s.dueMode!=='ready'&&s.dueMode!=='agree'?' selected':'')+'>Дата</option>'+
   '<option value="ready"'+(s.dueMode==='ready'?' selected':'')+'>По готовности</option>'+
   '<option value="agree"'+(s.dueMode==='agree'?' selected':'')+'>По договорённости</option></select>'+
   (s.dueMode!=='ready'&&s.dueMode!=='agree'?'<div class="row2" style="margin-top:6px"><input class="input" type="date" value="'+s.plan_start+'" onchange="state.cStages['+i+'].plan_start=this.value" placeholder="начало">'+
   '<input class="input" type="date" value="'+s.plan_ready+'" onchange="state.cStages['+i+'].plan_ready=this.value" placeholder="готовность"></div>':'')+
   '<select class="input" style="margin-top:6px" onchange="state.cStages['+i+'].by=this.value"><option value="">— исполнитель этапа —</option>'+
   DB.users.filter(u=>u.role==='worker'||u.role==='manager').map(u=>'<option '+(s.by===u.name?'selected':'')+'>'+u.name+'</option>').join('')+'</select></div>';
 }).join('');
}

function addTpl(){const n=document.getElementById('nt-name').value,p=+document.getElementById('nt-price').value||0;
 if(!n)return alert('Введите название');DB.templates.push({id:'t'+Date.now(),name:n,price:p});save();render()}
function delTpl(i){if(confirm('Удалить шаблон?')){DB.templates.splice(i,1);save();render()}}
function render(){
 const app=document.getElementById('app'),nav=document.getElementById('nav');
 if(!state.role){app.innerHTML=renderLogin();nav.style.display='none';return}
 // сохраняем прокрутку и фокус до перезаписи DOM
 var _y=window.scrollY;
 var _ae=document.activeElement;
 var _fid=(_ae&&_ae.id)?_ae.id:null;
 var _fpos=(_ae&&typeof _ae.selectionStart==='number')?_ae.selectionStart:null;
 nav.style.display='flex';
 nav.innerHTML=NAVS[state.role].map(n=>`<div class="nav-item ${state.screen===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</div>`).join('');
 const S={orders:renderOrders,details:()=>renderDetails(state.orderId),create:renderCreate,calendar:renderCalendar,tasks:renderTasks,shopping:renderShopping,reports:renderReports,admin:renderAdmin};
 let banner='';
 if(typeof offlineBanner==='function')banner=offlineBanner();
 app.innerHTML=banner+(S[state.screen]||renderOrders)();
 // восстановление прокрутки и фокуса (без сброса на верх при снапшотах/таймерах)
 requestAnimationFrame(function(){
  window.scrollTo(0,_y||0);
  if(_fid){
   var el=document.getElementById(_fid);
   if(el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA')){
    try{ el.focus(); if(_fpos!=null&&typeof el.setSelectionRange==='function')el.setSelectionRange(_fpos,_fpos); }catch(e){}
   }
  }
 });
}
render();
</script>

<script>
const APP_VERSION='1.4.8';
function updNote(v){return (v.text&&v.text.length)?v.text:('Плановое обновление №'+v.deploy+' от '+v.dt);}
function updStrip(on){document.getElementById('updStrip').style.display=on?'block':'none';document.body.style.paddingTop=on?'38px':'0';}
function updOpenModal(){var v=window.__updCur;if(!v)return;
 document.getElementById('updMTitle').textContent='Что нового? v'+v.version;
 document.getElementById('updMText').textContent='Обновление №'+v.deploy+' от '+v.dt+'\n\n'+updNote(v);
 document.getElementById('updMBtns').style.display='flex';
 document.getElementById('updMOk').style.display='none';
 document.getElementById('updOverlay').style.display='flex';}
function updCloseModal(){document.getElementById('updOverlay').style.display='none';}
(function(){
 document.getElementById('updNow').onclick=function(){var v=window.__updCur;if(v)localStorage.setItem('crm_ack',v.deploy);
  if('serviceWorker' in navigator){navigator.serviceWorker.getRegistration().then(function(r){if(r)r.update()});}
  setTimeout(function(){location.reload()},1200);};
 document.getElementById('updLate').onclick=function(){updCloseModal()};
 document.getElementById('updMOk').onclick=function(){updCloseModal()};
 document.getElementById('updOverlay').onclick=function(e){if(e.target===this)updCloseModal()};
 function check(){fetch('version.json?'+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(v){
  var ack=+(localStorage.getItem('crm_ack')||0), inf=+(localStorage.getItem('crm_info')||0);
  if((v.deploy||0)>ack){window.__updCur=v;updStrip(true);}
  else{updStrip(false);
